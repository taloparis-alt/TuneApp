# Compila TuneApp en la nube. No hace falta tener Java ni Android Studio en la máquina.
#
# Siempre produce el APK de prueba (artifact "tuneapp-apk"), para instalar a mano.
#
# Si además están cargados los secrets de firma, produce el AAB firmado que pide
# Play Store (artifact "tuneapp-aab"). Secrets necesarios:
#   KEYSTORE_BASE64    el archivo .keystore codificado en base64
#   KEYSTORE_PASSWORD  contraseña del almacén
#   KEY_ALIAS          alias de la clave
#   KEY_PASSWORD       contraseña de la clave
# Sin esos secrets el paso se saltea solo y el workflow igual termina bien.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Se copia a env porque el contexto `secrets` no se puede leer desde un `if:` de paso.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 exige node >= 22: con la 20, `cap sync` falla.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # El runner de Ubuntu ya trae el SDK de Android instalado, así que no hace
      # falta bajarlo. Este paso sólo deja constancia de con qué se compiló.
      - name: Diagnóstico del entorno
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "java    $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME = ${ANDROID_HOME:-(vacío)}"
          echo "firma de release: ${KEYSTORE_BASE64:+configurada}${KEYSTORE_BASE64:-sin configurar}"
          echo "plataformas del SDK instaladas:"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "  (ninguna; Gradle las bajará solo)"

      - name: Dependencias
        run: npm ci

      - name: Copiar la app web al proyecto nativo
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar la clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Compilar AAB firmado para Play Store
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # Si algo falla, los informes de Gradle quedan a mano para ver el error
      # sin tener que leer todo el log.
      - name: Informes de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-error
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore

      - name: Publicar el APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: tuneapp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar el AAB para Play Store
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tuneapp-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Los artifacts sirven para guardar cosas, no para repartirlas: hay que estar
      # con sesion iniciada en GitHub, vencen a los 90 dias, y vienen en .zip, que es
      # justo lo que el antivirus de Chrome bloquea. El release resuelve las tres:
      # link publico, fijo, y el .apk suelto para abrir desde el celular.
      #
      # La etiqueta `ultima` se reescribe en cada compilacion, asi el link no cambia.
      - name: Publicar el APK como release descargable
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CORRIDA: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tuneapp.apk

          cat > notas.md <<NOTAS
          APK de prueba de TuneApp, recien compilado desde \`main\`.

          - Commit: \`$SHA\`
          - Compilacion: #$CORRIDA

          Abri este link desde el celular y descarga **tuneapp.apk**. Android va a pedir
          permiso para *instalar apps de origen desconocido*: es porque todavia no viene
          de Play Store, no porque el archivo tenga algo raro.

          Este es el APK de prueba, firmado con la clave de depuracion. El de Play Store
          es el .aab firmado, que va por otro camino y no se instala a mano.
          NOTAS

          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima tuneapp.apk --title "Ultima version para probar" --notes-file notas.md
