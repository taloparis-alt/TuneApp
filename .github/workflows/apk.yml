# Compila el APK en la nube. No hace falta tener Java ni Android Studio en la máquina.
# Se dispara solo en cada push a main, o a mano desde la pestaña Actions de GitHub.
# El APK queda para descargar como "artifact" al final de la corrida.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El runner de Ubuntu ya trae el SDK de Android instalado, así que no hace
      # falta bajarlo. Este paso sólo confirma dónde está y deja constancia en el
      # log de con qué versiones se compiló.
      - name: Diagnóstico del entorno
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "java    $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME     = ${ANDROID_HOME:-(vacío)}"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT:-(vacío)}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || echo "no se encontró el SDK"

      - name: Dependencias
        run: npm ci

      - name: Copiar la app web al proyecto nativo
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Si la compilación falla, esto deja los informes de Gradle a mano para
      # poder ver el error sin tener que leer todo el log.
      - name: Informes de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-error
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: afinador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
