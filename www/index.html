<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="TuneApp — afinador de guitarra, ukelele y charango con metrónomo. Funciona sin conexión.">
<title>TuneApp</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TuneApp">
<script>
  // Se aplica antes del primer pintado para que no haya destello de tema.
  try {
    var s = JSON.parse(localStorage.getItem('afinador.v1') || '{}');
    if (s.theme) {
      document.documentElement.dataset.theme = s.theme;
      var bg = { noche: '#0b0e14', madera: '#14100c', dia: '#f6f4f0', grafito: '#121212' }[s.theme];
      if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="brand">TuneApp</h1>
  <button class="a4-badge" id="a4Badge" title="Frecuencia de referencia">440.0 Hz</button>
</header>

<main class="stack">
  <section class="view is-active" data-view="tuner" aria-label="Afinador"></section>
  <section class="view" data-view="manual" aria-label="Afinación manual"></section>
  <section class="view" data-view="metro" aria-label="Metrónomo"></section>
  <section class="view" data-view="settings" aria-label="Ajustes"></section>
</main>

<div class="mic-bar" id="micBar">
  <button class="btn-primary" id="micBtn">Activar micrófono</button>
  <p class="mic-msg is-hidden" id="micMsg"></p>
</div>

<nav class="tabbar" aria-label="Secciones">
  <button class="tab is-on" data-tab="tuner">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11.2M12 3l5 2.2M12 3 7 5.2"/><circle cx="12" cy="17.5" r="3.2"/></svg>
    <span>Afinador</span>
  </button>
  <button class="tab" data-tab="manual">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5a8 8 0 0 1 16 0"/><path d="m12 15.5 4.2-5"/><circle cx="12" cy="15.5" r="1.6"/></svg>
    <span>Manual</span>
  </button>
  <button class="tab" data-tab="metro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 3.5h5.6L19 20.5H5z"/><path d="M15.8 8 8.6 16.5"/></svg>
    <span>Metrónomo</span>
  </button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
